name: nomue-verifier CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Rebuild/package provenance regression evidence
        run: npm run rebuild:evidence -- "${{ runner.temp }}/rebuild-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: rebuild-regression-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/rebuild-evidence/
          if-no-files-found: error
