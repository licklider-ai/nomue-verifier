name: Correct npm latest tag

on:
  push:
    branches:
      - operations/npm-latest-correction
    paths:
      - .github/workflows/correct-npm-latest.yml

permissions:
  contents: read

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Move latest to the published correction
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package='@licklider/nomue-verifier'
          target='0.2.1-rc.1'
          current="$(npm view "$package" dist-tags.latest)"
          if [[ "$current" != '0.2.1-rc.0' && "$current" != "$target" ]]; then
            echo "Refusing unexpected latest tag: $current" >&2
            exit 1
          fi
          npm view "$package@$target" version
          npm dist-tag add "$package@$target" latest
          for attempt in {1..12}; do
            observed="$(npm view "$package" dist-tags.latest 2>/dev/null || true)"
            if [[ "$observed" == "$target" ]]; then
              echo "latest=$observed"
              exit 0
            fi
            sleep 5
          done
          echo "latest did not resolve to $target" >&2
          exit 1
