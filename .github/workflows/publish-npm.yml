name: Publish npm release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-candidate
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'licklider-ai/nomue-verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install release dependencies
        run: npm ci
      - name: Run release tests
        run: npm test
      - name: Exercise the packed public CLI
        run: npm run test:package
      - name: Refuse stable or already-published versions
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.name)")
          package_version=$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.version)")
          [[ "$package_version" == *-rc.* ]]
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published" >&2
            exit 1
          fi
      - name: Publish with npm trusted publishing
        run: npm publish --access public --tag rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Confirm the exact live version
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.name)")
          package_version=$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.version)")
          for attempt in {1..12}; do
            if [[ "$(npm view "$package_name@$package_version" version 2>/dev/null || true)" == "$package_version" ]]; then
              npm view "$package_name@$package_version" version dist.integrity gitHead --json
              exit 0
            fi
            sleep 5
          done
          echo "$package_name@$package_version did not become queryable" >&2
          exit 1
